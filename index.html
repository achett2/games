<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jacob's Games</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
<style>
  body{margin:0; min-height:100vh; font-family:"Baloo 2",system-ui,sans-serif; color:#fff7ea;
       background:radial-gradient(120% 80% at 50% 0%, #2f1b63 0%, #160d2b 65%); padding:24px 16px;}
  h1{font-family:Bangers; letter-spacing:.06em; text-align:center; font-size:48px; margin:10px 0 20px; color:#ffd24a;}
  .wrap{max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}
  a.card{display:flex; gap:14px; align-items:center; text-decoration:none; color:inherit; background:#2a1b52;
         border:2px solid #4a3685; border-radius:18px; padding:14px;}
  a.card img{width:64px; height:64px; border-radius:14px;}
  .nm{font-size:22px; font-weight:800;} .ds{color:#b9a8d8; font-weight:700;}
</style>
</head>
<body>
  <h1>GAMES</h1>
  <div class="wrap">
    <a class="card" href="spell-slice/"><img src="spell-slice/icon-192.png" alt="" />
      <div><div class="nm">Spell Slice</div><div class="ds">Vowels, nouns &amp; verbs, syllables, endings, vowel teams</div></div></a>
    <a class="card" href="https://achett2.github.io/kaiju-blitz/"><img src="https://achett2.github.io/kaiju-blitz/icon-192.png" alt="" />
      <div><div class="nm">Kaiju Blitz</div><div class="ds">Math facts</div></div></a>
  </div>
</body>
</html>
