<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Spell Slice</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#160d2b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Spell Slice" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#160d2b; --bg2:#24154a; --ink:#fff7ea; --dim:#b9a8d8; --gold:#ffd24a; --good:#4be37a;
    --bad:#ff5a6e; --vow:#ff9f1c; --con:#38b6ff; --noun:#38b6ff; --verb:#ff7a45; --card:#2a1b52; --line:#4a3685;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; overflow:hidden; background:var(--bg);}
  body{font-family:"Baloo 2",system-ui,sans-serif; color:var(--ink); -webkit-tap-highlight-color:transparent;
       -webkit-user-select:none; user-select:none; touch-action:none;}
  button{font-family:inherit; cursor:pointer;}
  #cv{position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; display:block; touch-action:none;}
  .hidden{display:none !important;}

  /* ---------- HUD ---------- */
  #hud{position:fixed; left:0; right:0; top:0; padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
       pointer-events:none; text-align:center; z-index:5;
       background:linear-gradient(180deg, rgba(22,13,43,.96) 0%, rgba(22,13,43,.85) 75%, rgba(22,13,43,0) 100%);}
  #hud button{pointer-events:auto;}
  .hudtop{display:flex; align-items:center; gap:8px; max-width:760px; margin:0 auto;}
  .iconbtn{border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px;
           font-size:18px; width:40px; height:40px; line-height:1; padding:0;}
  #prog{flex:1; display:flex; gap:4px; justify-content:center; flex-wrap:wrap;}
  #prog i{width:10px; height:10px; border-radius:50%; background:#3d2d6b; display:block;}
  #prog i.ok{background:var(--good);} #prog i.miss{background:var(--vow);} #prog i.cur{background:#fff; box-shadow:0 0 8px #fff;}
  #score{font-family:Bangers; font-size:24px; letter-spacing:.04em; color:var(--gold); min-width:64px; text-align:right;}
  #tag{font-weight:800; font-size:13px; letter-spacing:.12em; color:var(--dim); margin-top:4px; min-height:18px;}
  #tag .warm{color:#ffb86b;} #tag .chain{color:#9ef0ff;}
  #prompt{font-family:Bangers; font-size:clamp(24px,6.4vw,38px); letter-spacing:.04em; line-height:1.05; margin:2px auto 4px;
          max-width:760px; text-shadow:0 3px 0 #000, 0 0 18px rgba(255,210,74,.35);}
  #prompt b{color:var(--gold); font-weight:normal;}
  #ctx{max-width:760px; margin:0 auto;}
  #note{max-width:680px; margin:6px auto 0; font-weight:700; font-size:16px; line-height:1.25; min-height:0;
        border-radius:12px; padding:0;}
  #note.show{padding:8px 12px; background:rgba(0,0,0,.35); border:2px solid var(--line);}
  #note.good{border-color:var(--good); background:rgba(40,120,70,.35);}
  #note.hint{border-color:var(--vow); background:rgba(120,70,20,.35);}

  .tiles{display:flex; justify-content:center; gap:5px; flex-wrap:nowrap;}
  .tile{display:flex; flex-direction:column; align-items:center;}
  .tile .L{width:clamp(30px,8.5vw,46px); height:clamp(36px,10vw,52px); border-radius:10px; background:#3a2a6b; border:2px solid #5a46a0;
           font-family:Bangers; font-size:clamp(24px,7vw,36px); display:flex; align-items:center; justify-content:center; transition:all .2s;}
  .tile .C{font-family:Bangers; font-size:20px; height:24px; color:transparent; transition:color .3s;}
  .tile.v .L{background:#a3550a; border-color:var(--vow); box-shadow:0 0 10px rgba(255,159,28,.6);}
  .tile.c .L{background:#14507a; border-color:var(--con); box-shadow:0 0 10px rgba(56,182,255,.6);}
  .tile.team .L{background:#7a1e8a; border-color:#ff7af0; box-shadow:0 0 10px rgba(255,122,240,.7);}
  .tile .C.on{color:var(--dim);} .tile .C.on.V{color:var(--vow);} .tile .C.on.Cc{color:var(--con);}
  .tile.gap{width:10px;}
  .sent{font-size:clamp(20px,5.4vw,28px); font-weight:800; line-height:1.9; display:flex; flex-wrap:wrap; justify-content:center; gap:0 8px;}
  .sent .w{position:relative; padding:0 3px; border-radius:6px;}
  .sent .w.hl{background:var(--gold); color:#2a1b00; padding:0 8px;}
  .sent .w.hitn{background:rgba(56,182,255,.35);} .sent .w.hitv{background:rgba(255,122,69,.4);}
  .sent .w[data-t]::after{content:attr(data-t); position:absolute; left:50%; top:-14px; transform:translateX(-50%);
          font-size:12px; font-weight:800; letter-spacing:.08em; padding:0 5px; border-radius:6px; line-height:16px; opacity:0; transition:opacity .3s;}
  .sent.tags .w[data-t]::after{opacity:1;}
  .sent .w[data-t="NOUN"]::after{background:var(--noun); color:#001827;} .sent .w[data-t="VERB"]::after{background:var(--verb); color:#2a0a00;}
  .formula{font-family:Bangers; font-size:clamp(26px,7vw,40px); letter-spacing:.05em;}
  .formula .pos{font-family:"Baloo 2"; font-weight:800; font-size:14px; letter-spacing:.12em; display:block; color:var(--dim);}
  .formula .pos.v{color:var(--verb);} .formula .pos.n{color:var(--noun);}
  .clue{font-size:clamp(19px,5vw,26px); font-weight:800;}
  .clue .blank{display:inline-block; min-width:70px; border-bottom:3px solid var(--gold); margin:0 4px;}
  .speak{border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; font-size:16px; font-weight:800; padding:2px 12px; margin-left:6px; vertical-align:middle;}

  #toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
         width:max-content; max-width:min(92vw,620px); background:#3b0f1e; border:2px solid var(--bad); color:#fff; border-radius:14px;
         padding:10px 14px; font-weight:800; font-size:17px; line-height:1.25; text-align:center; opacity:0; transition:all .25s; z-index:8; pointer-events:none;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast.info{background:#1d2b55; border-color:#7aa8ff;}
  #toast.new{background:#3d2a00; border-color:var(--gold);}

  /* ---------- Screens ---------- */
  .screen{position:fixed; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; z-index:10;
          background:radial-gradient(120% 80% at 50% 0%, #2f1b63 0%, #160d2b 65%);
          padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
  .inner{max-width:560px; margin:0 auto;}
  .title{font-family:Bangers; font-size:clamp(46px,14vw,72px); text-align:center; letter-spacing:.05em; margin:6px 0 0; line-height:1;
         background:linear-gradient(180deg,#fff2a8,#ff9f1c 60%,#ff4d6d); -webkit-background-clip:text; background-clip:text; color:transparent;
         filter:drop-shadow(0 4px 0 #000);}
  .subt{text-align:center; color:var(--dim); font-weight:800; letter-spacing:.06em; margin:4px 0 14px;}
  .stats{display:flex; justify-content:center; gap:10px; margin-bottom:12px;}
  .pill{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:4px 14px; font-weight:800;}
  .sect{font-family:Bangers; letter-spacing:.12em; font-size:22px; color:var(--gold); margin:16px 4px 8px;}
  .arrow{text-align:center; color:var(--line); font-size:20px; line-height:1; margin:2px 0;}
  .card{display:flex; align-items:center; gap:12px; background:var(--card); border:2px solid var(--line); border-radius:18px;
        padding:12px 12px; position:relative;}
  .card.locked{opacity:.45;}
  .card .ic{font-size:34px; width:50px; text-align:center;}
  .card .mid{flex:1; min-width:0;}
  .card .nm{font-weight:800; font-size:19px; line-height:1.1;}
  .card .wk{font-size:13px; font-weight:800; color:var(--dim); letter-spacing:.08em;}
  .card .bar{height:8px; background:#1a1036; border-radius:6px; margin-top:6px; overflow:hidden;}
  .card .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--good),#b6ff6b); border-radius:6px;}
  .card .meta{font-size:13px; color:var(--dim); font-weight:700; margin-top:2px;}
  .card .stars{color:var(--gold); font-size:15px; letter-spacing:2px;}
  .card .btns{display:flex; flex-direction:column; gap:6px;}
  .play{border:none; border-radius:12px; background:linear-gradient(180deg,#ffcf4a,#ff8a1c); color:#2b1300; font-weight:800; font-size:17px; padding:8px 14px; box-shadow:0 3px 0 #a04a00;}
  .ghost{border:2px solid var(--line); border-radius:12px; background:transparent; color:var(--ink); font-weight:800; font-size:14px; padding:4px 10px;}
  .big{display:block; width:100%; margin-top:12px; font-size:22px; padding:12px;}
  .mixed{margin-top:18px;}
  .mixed .card{border-color:#7a5cff; background:linear-gradient(135deg,#2d1d66,#3b1a55);}
  .row{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
  .build{position:fixed; right:8px; bottom:calc(4px + env(safe-area-inset-bottom)); font-size:11px; color:#6f5ca3; z-index:20; pointer-events:none;}

  .modal{position:fixed; inset:0; background:rgba(8,4,20,.72); z-index:30; display:flex; align-items:center; justify-content:center; padding:16px; touch-action:pan-y;}
  .panel{background:linear-gradient(180deg,#2f1d62,#1f1342); border:3px solid #6a50c0; border-radius:22px; padding:18px 18px 16px;
         max-width:560px; width:100%; max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch; box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .panel h2{font-family:Bangers; letter-spacing:.06em; font-size:32px; margin:0 0 8px; text-align:center; color:var(--gold);}
  .panel p{font-size:18px; line-height:1.35; margin:8px 0;}
  .panel .big-why{font-size:20px; font-weight:800; text-align:center;}
  .lesson .box{background:rgba(0,0,0,.25); border:2px solid var(--line); border-radius:14px; padding:10px 12px; margin:10px 0;}
  .lesson .k{font-family:Bangers; letter-spacing:.05em; font-size:24px;}
  .lesson .vv{color:var(--vow);} .lesson .cc{color:var(--con);} .lesson .nn{color:var(--noun);} .lesson .vb{color:var(--verb);} .lesson .tm{color:#ff7af0;}
  .lesson .ex{font-family:Bangers; letter-spacing:.06em; font-size:22px; text-align:center;}
  .lesson .how{font-size:15px; color:var(--dim);}
  .res-stars{font-size:46px; text-align:center; color:var(--gold); letter-spacing:6px; text-shadow:0 0 18px rgba(255,210,74,.6);}
  .skillrow{display:flex; align-items:center; gap:8px; margin:6px 0; font-weight:700;}
  .skillrow .n{flex:1; font-size:15px;}
  .skillrow .b{width:42%; height:10px; background:#1a1036; border-radius:6px; overflow:hidden;}
  .skillrow .b i{display:block; height:100%; background:linear-gradient(90deg,var(--good),#b6ff6b);}
  .skillrow .b i.low{background:linear-gradient(90deg,#ff7a45,var(--gold));}
  .skillrow .x{width:56px; text-align:right; font-size:14px; color:var(--dim);}
  .seg{display:flex; gap:6px;}
  .seg button{flex:1; border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:8px; font-weight:800; font-size:16px;}
  .seg button.on{border-color:var(--gold); background:rgba(255,210,74,.18); color:var(--gold);}
  .setlbl{font-weight:800; color:var(--dim); letter-spacing:.06em; font-size:14px; margin:14px 0 6px;}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hudtop">
    <button class="iconbtn" id="quitBtn" aria-label="Quit">✕</button>
    <div id="prog"></div>
    <div id="score">0</div>
  </div>
  <div id="tag"></div>
  <div id="prompt"></div>
  <div id="ctx"></div>
  <div id="note"></div>
</div>
<div id="toast"></div>

<!-- Map / home -->
<div id="home" class="screen">
  <div class="inner">
    <div style="display:flex; justify-content:flex-end;"><button class="iconbtn" id="setBtn" aria-label="Settings">⚙️</button></div>
    <div class="title">SPELL SLICE</div>
    <div class="subt">SLICE YOUR WAY TO WORD POWER</div>
    <div class="stats"><span class="pill">⭐ <span id="hStars">0</span></span><span class="pill">🍉 <span id="hBest">0</span> best</span></div>
    <div id="map"></div>
    <div class="mixed" id="mixedWrap"></div>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="panel" id="panel"></div></div>
<div class="build" id="build"></div>

<script>
"use strict";
/* =====================================================================
   SPELL SLICE — a Fruit-Ninja-style phonics/grammar game.
   Single file, no build step. Curriculum: Foundations (vowels/consonants,
   nouns/verbs) + Unit 1 (VC/CV, inflected endings, base words, vowel
   digraphs, diphthongs). Mastery per skill lives in localStorage.
   ===================================================================== */
const BUILD = "v1";
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const sample = (a,n) => shuffle(a).slice(0,n);
const uniq = a => [...new Set(a)];
const U = s => s.toUpperCase();
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Foundation 1: letters ---------- */
const VOWELS = "aeiou";
const CONS = "BCDFGHJKLMNPQRSTVWXZ";            // Y left out of letter drills on purpose
const isV = ch => VOWELS.includes(ch.toLowerCase());
const codeOf = w => [...w].map(c => isV(c) ? "V" : "C").join("");
const spaced = s => [...s].join(" ");

/* =====================================================================
   CONTENT
   ===================================================================== */
const NOUNS = {
  person:["teacher","doctor","farmer","baby","girl","boy","mom","dad","sister","pilot","chef","king"],
  place:["school","park","house","zoo","beach","city","kitchen","store","farm","library"],
  thing:["desk","ball","book","pencil","chair","car","apple","shoe","cake","window","bus","hat"],
  animal:["dog","cat","bird","horse","lion","frog","duck","tiger","rabbit","pig","cow","bear"]
};
const NOUN_CAT = {}; for(const k in NOUNS) NOUNS[k].forEach(w => NOUN_CAT[w] = k);
const NOUN_LIST = Object.keys(NOUN_CAT);
const VERB_LIST = ["jump","run","swim","laugh","write","eat","sing","throw","climb","read","sleep","kick","build","catch",
                   "hop","shout","clap","push","sit","grab","sneeze","bake","skip","dig","yell","chew","spin","wiggle"];

// Sentences: {word:n} = noun, {word:v} = verb. Kept free of pronouns/helping verbs so the target words are clear.
const SENTS = [
  "The {dog:n} {runs:v} fast.", "{Mom:n} {bakes:v} a {cake:n}.", "The {cat:n} {sleeps:v} on the {bed:n}.",
  "A {bird:n} {sings:v} in the {tree:n}.", "The {teacher:n} {reads:v} a {book:n}.", "{Jacob:n} {kicks:v} the {ball:n}.",
  "The {frog:n} {jumped:v} into the {pond:n}.", "My {sister:n} {laughs:v} at the {joke:n}.", "The {baby:n} {cried:v} loudly.",
  "The {boys:n} {played:v} at the {park:n}.", "A {horse:n} {eats:v} {hay:n}.", "The {children:n} {swim:v} in the {lake:n}.",
  "{Dad:n} {fixes:v} the {car:n}.", "The {fox:n} {hopped:v} over the {log:n}.", "The {puppy:n} {chews:v} a {shoe:n}.",
  "Our {class:n} {visits:v} the {zoo:n}.", "The {owner:n} {walks:v} the {dog:n}.", "The {ball:n} {bounced:v} high.",
  "The {chef:n} {cooks:v} {soup:n}.", "A {duck:n} {swims:v} in the {pond:n}.", "The {pilot:n} {flies:v} the {plane:n}.",
  "The {farmer:n} {feeds:v} the {pigs:n}.", "{Grandma:n} {knits:v} a {hat:n}.", "The {fountain:n} {sprays:v} {water:n}."
];
// Same word, different job (noun vs verb depends on the sentence).
const TRICKY = [
  "The {kids:n} {play:v} tag.", "We saw a {play:n} at school.",
  "{Birds:n} {fly:v} south.", "A {fly:n} landed on my nose.",
  "I {fish:v} at the lake.", "The {fish:n} swims fast.",
  "Dogs {dream:v} at night.", "I had a funny {dream:n}.",
  "Please {water:v} the plants.", "I drink cold {water:n}.",
  "I {kick:v} the ball.", "That was a great {kick:n}!",
  "The {swing:n} is red.", "I {swing:v} up high.",
  "We {paint:v} the fence.", "The {paint:n} is still wet.",
  "Our team will {run:v} fast.", "Dad went for a {run:n}.",
  "I {shower:v} after soccer.", "The {shower:n} is too cold.",
  "The {display:n} has new toys.", "Let's {display:v} our art.",
  "Watch the ball {bounce:v}.", "That ball has a big {bounce:n}."
];
function parseSent(s){
  const toks = []; const re = /\{([^:}]+):(\w)\}([.,!?]?)|([^\s{}]+)/g; let m;
  while((m = re.exec(s))){
    if(m[1]) toks.push({w:m[1], tag:m[2], p:m[3]||""});
    else { const mm = m[4].match(/^(.*?)([.,!?]?)$/); toks.push({w:mm[1], tag:null, p:mm[2]}); }
  }
  return toks;
}

/* ---------- Unit 1 Week 1: VC/CV ---------- */
const VCCV = ["rab|bit","nap|kin","bas|ket","kit|ten","pup|pet","muf|fin","pic|nic","sun|set","con|test","in|sect","tab|let",
  "hel|met","mag|net","win|ter","mit|ten","hid|den","gob|lin","pen|cil","den|tist","prob|lem","hap|pen","let|ter","but|ton",
  "ten|nis","cac|tus","ab|sent","plas|tic","sig|nal","vel|vet","sud|den","traf|fic","mar|ket"]
  .map(s => { const [a,b] = s.split("|"); return {w:a+b, syl:[a,b], cut:a.length}; });
const VCV_WORDS = ["robot","tiger","paper","music","open","hotel","lemon","camel","seven","wagon","salad","pilot","tulip",
  "cabin","planet","solid","metal","visit","bacon","robin","silent","spider","comet"].filter(w => !w.includes("y"));
const PATTERN_WORDS = {
  CVC:["cat","dog","sun","pig","hat","bed","cup","map","rab","nap","hop","run","sit","bug","jet","fox","kit","mug"],
  VCC:["egg","add","ant","end","ink","elf","odd","ask","its","act","imp","inn","ill","all"],
  VCV:["ago","ape","age","ice","use","ate","ode","axe","eve","ore","owe","ace"],
  CVV:["see","tea","bee","toe","pie","zoo","too","sea","tie","foe"]
};

/* ---------- Week 2: inflected endings ----------
   rule: A just add · D double final consonant · E drop silent e · S add -es · Y change y to i */
const INFL = `jump ed jumped A v|jump ing jumping A v|play ed played A v|play ing playing A v|help ed helped A v|look ing looking A v|
rain ed rained A v|dream ing dreaming A v|paint ed painted A v|kick s kicks A v|enjoy ed enjoyed A v|annoy ing annoying A v|
display ed displayed A v|stay ed stayed A v|braid ed braided A v|dog s dogs A n|boat s boats A n|owner s owners A n|
shadow s shadows A n|fountain s fountains A n|run ing running D v|hop ed hopped D v|hop ing hopping D v|stop ed stopped D v|
clap ed clapped D v|swim ing swimming D v|sit ing sitting D v|skip ed skipped D v|drop ed dropped D v|plan ed planned D v|
grab ing grabbing D v|hug ed hugged D v|shop ing shopping D v|win ing winning D v|dig ing digging D v|jog ed jogged D v|
nap ing napping D v|make ing making E v|bake ed baked E v|ride ing riding E v|smile ed smiled E v|hope ing hoping E v|
hope ed hoped E v|dance ing dancing E v|bounce ing bouncing E v|bounce ed bounced E v|wave ed waved E v|skate ing skating E v|
agree ed agreed E v|fix es fixes S v|wash es washes S v|catch es catches S v|push es pushes S v|mix es mixes S v|
brush es brushes S v|peach es peaches S n|box es boxes S n|bus es buses S n|wish es wishes S n|glass es glasses S n|
fox es foxes S n|dish es dishes S n|bench es benches S n|lunch es lunches S n|cry ed cried Y v|cry es cries Y v|
carry ed carried Y v|try ed tried Y v|hurry ed hurried Y v|copy ed copied Y v|fly es flies Y v|baby es babies Y n|puppy es puppies Y n`
  .split("|").map(s => { const [base,end,res,rule,pos] = s.trim().split(" "); return {base,end,res,rule,pos}; });
const RULE_LABEL = {A:"JUST ADD", D:"DOUBLE", E:"DROP E", Y:"Y → I", S:"ADD -ES"};
const ES_BASES = ["fox","wish","bus","box","peach","dish","glass","bench","lunch","fix","wash","catch","push","mix","kiss","brush","pass","beach"];

/* =====================================================================
   QUESTION GENERATORS
   slice: {kind:"slice", skill, prompt, ctx, items:[{label,target,why,idx,note}], why, hint}
   chop:  {kind:"chop",  skill, prompt, word, cuts:[...], showCode, why, hint, cutWhy}

function consWhy(l){
  if(l === "Y") return "Y isn't one of A E I O U — here it's a consonant. (Y can team up with a vowel, like AY or OY!)";
  if(l === "W") return "W is a consonant. (W can team up with a vowel, like OW!)";
  return `${l} is a consonant. The vowels are A, E, I, O, U.`;
}
const vowelWhy = l => `${l} is a vowel (A E I O U) — not a consonant.`;
function optsItems(correct, wrong, whyFn){
  return shuffle([{label:correct, target:true}, ...wrong.map(w => ({label:w, target:false, why:whyFn ? whyFn(w) : ""}))]);
}

function codeDistractors(code){
  const out = new Set(); let guard = 0;
  const flip = (s,i) => s.slice(0,i) + (s[i] === "V" ? "C" : "V") + s.slice(i+1);
  while(out.size < 2 && guard++ < 60){
    let d = flip(code, rnd(code.length));
    if(Math.random() < 0.5) d = flip(d, rnd(code.length));
    if(d !== code) out.add(d);
  }
  return [...out];
}
function qVCCode(w, preMark){
  w = w || pick(F1_WORDS.filter(x => x.length >= 4 && x.length <= 7));

  return {kind:"slice", skill:"vc_code", prompt:"Turn it into <b>V/C</b> code", ctx:{t:"word", w:U(w), pre:preMark ? "v" : null},
    items:optsItems(code, codeDistractors(code), () => "Check each letter: vowel → V, consonant → C."), revealCode:true,
    why:`${U(w)} → ${code}. Each vowel is a V, each consonant is a C.`, hint:"Go letter by letter: A E I O U → V, everything else → C."};
}
function qVCPattern(chunk){
  let pat;
  if(!chunk){ pat = pick(["CVC","CVC","VCC","VCV","CVV"]); chunk = pick(PATTERN_WORDS[pat]); }
  pat = codeOf(chunk);
  const others = ["CVC","VCV","VCC","CVV"].filter(p => p !== pat);
  const wrong = ["CVC","VCV","VCC"].includes(pat) ? ["CVC","VCV","VCC"].filter(p => p !== pat) : sample(others, 2);
  return {kind:"slice", skill:"vc_pattern", prompt:`Which pattern is <b>${U(chunk)}</b>?`, ctx:{t:"word", w:U(chunk)},
    items:optsItems(pat, wrong, p => `${p} doesn't match. ${U(chunk)}: ${[...U(chunk)].map(l => l+"="+(isV(l)?"V":"C")).join("  ")}`), revealCode:true,
    why:`${U(chunk)} = ${pat}: ${[...pat].map(c => c === "V" ? "vowel" : "consonant").join(" · ")}.`, hint:"Say each letter: is it a vowel (V) or a consonant (C)?"};
}

// --- Week 2: inflected endings
function inflWrong(e){
  const {base, end, res, rule} = e; const last = base.slice(-1); const c = [];
  const noE = base.endsWith("e") ? base.slice(0,-1) : base;
  if(rule === "A"){ if(!isV(last) && !"ywx".includes(last)) c.push(base+last+end); if(end === "ed") c.push(base+"t"); if(end === "ing") c.push(base+"in");
                    if(end === "s") c.push(base+"es"); if(last === "y") c.push(base.slice(0,-1)+"i"+end); }
  if(rule === "D"){ c.push(base+end, base+"e"+end); }
  if(rule === "E"){ c.push(base+end, noE+noE.slice(-1)+end); }
  if(rule === "S"){ c.push(base+"s", base+"is"); }
  if(rule === "Y"){ c.push(base+end, end === "es" ? base+"s" : base+"i"+end); }
  c.push(base+end, base+last+end, noE+end, base+"e"+end, base+end+end.slice(-1));
  return uniq(c).filter(x => x !== res).slice(0,2);
}
function inflWhy(e){
  const {base:b, end, res, rule, pos} = e; const l = b.slice(-1), c = codeOf(b);
  if(rule === "D") return `${U(b)} ends ${c.slice(-3)}: one short vowel + one consonant. Double the ${U(l)} before -${end}: ${U(res)}.`;
  if(rule === "E") return `${U(b)} ends in a silent E. Drop the E before -${end} (it starts with a vowel): ${U(res)}.`;
  if(rule === "Y") return `${U(b)} ends in consonant + Y. Change Y to I, then add -${end}: ${U(res)}.`;
  if(rule === "S"){ const tail = /(ch|sh)$/.test(b) ? b.slice(-2) : l; return `${U(b)} ends in ${U(tail)}. After S, X, Z, CH, SH add -ES — you can hear the extra beat: ${U(res)}.`; }
  if(end === "s") return pos === "n" ? `${U(b)} is a noun. Just add -S to mean more than one: ${U(res)}.` : `Just add -S: ${U(res)}.`;
  if("yw".includes(l) && isV(b.slice(-2,-1))) return `${U(b)} ends in a vowel team (${U(b.slice(-2))}) — keep the ${U(l)} and just add -${end}: ${U(res)}.`;
  if(c.endsWith("CC")) return `${U(b)} ends in two consonants (${U(b.slice(-2))}) — no doubling. Just add -${end}: ${U(res)}.`;
  if(c.endsWith("VVC")) return `${U(b)} has a vowel team (${U(b.slice(-3,-1))}), not one short vowel — no doubling. Just add -${end}: ${U(res)}.`;
  return `Just add -${end}: ${U(res)}.`;
}
function posLabel(e){ return e.pos === "n" ? (e.end.startsWith("e") || e.end === "s" ? "NOUN · more than one" : "NOUN") : "VERB"; }
function qInflAdd(e){
  e = e || pick(INFL);

    ctx:{t:"text", html:`<div class="formula"><span class="pos ${e.pos}">${posLabel(e)}</span>${U(e.base)} + ${U(e.end)} = ?</div>`},
    items:optsItems(e.res, inflWrong(e), w => `Not "${w}". ${inflWhy(e)}`), why:inflWhy(e),
    hint:"Check the end of the base word: CVC → double · silent E → drop · consonant+Y → I · s/x/ch/sh → ES."};
}
function qInflRule(e){
  e = e || pick(INFL);
  const wrong = sample(Object.keys(RULE_LABEL).filter(r => r !== e.rule), 2).map(r => RULE_LABEL[r]);
  return {kind:"slice", skill:"infl_rule", prompt:`Why is it <b>${U(e.res)}</b>?`,
    ctx:{t:"text", html:`<div class="formula"><span class="pos ${e.pos}">${posLabel(e)}</span>${U(e.base)} + ${U(e.end)} → ${U(e.res)}</div>`},
    items:optsItems(RULE_LABEL[e.rule], wrong, () => inflWhy(e)), why:inflWhy(e),

    why:`-ES words: ${t.map(w => w+"es").join(", ")}. You can hear the extra beat!`, hint:"Look at the LAST letters: s, x, z, ch, or sh?"};

const CHAINS = {

  // RABBIT: vowels → V/C → split
  vccv(){ const e = pick(VCCV);
    return {label:U(e.w), steps:[
      qVWord(e.w, `${U(e.w)} → ${spaced(codeOf(e.w))}. Next: turn the whole word into V/C code.`),
      Object.assign(qVCCode(e.w, true), {why:`${codeOf(e.w)} — see the V C C V in the middle? Two consonants between two vowels!`}),

  // RUN: CVC? → run+ing → why double
  dbl(ok){ const e = pick(INFL.filter(x => x.rule === "D" && x.base.length === 3));
    const st = [Object.assign(qVCPattern(e.base), {why:`${U(e.base)} is CVC — one short vowel between two consonants. Remember that…`}), qInflAdd(e)];
    if(ok("infl_rule")) st.push(qInflRule(e));
    return {label:U(e.base)+" + "+U(e.end), steps:st}; },
  // The frog JUMPED → find verb → jump|ed → ending
  base(ok){ const w = pick(Object.keys(BASE_SENT)); const e = BASE_CHOP.find(x => x.w === w); const s = BASE_SENT[w];
    const toks = parseSent(s); const tok = toks.find(t => t.w === w);
    const first = tok.tag === "v" ? qSent(s, "v") : qNVHighlight(s.replace(/\{([^:}]+):(\w)\}/g, (m,a,b) => a === w ? m : a));

    const ie = {base:e.base, end:e.end, res:e.w, rule:e.rule, pos:"v"};

    const both = isV(h.t[1]);
    const st = [qVWord(s.w, both ? `${U(h.t[0])} and ${U(h.t[1])} sit side by side. Two vowels can TEAM UP to make ONE sound!`

/* =====================================================================
   ROUND PLANNING
   ===================================================================== */
let R = null;   // current round
function availableSkillsForMix(){
  const out = [];
  TOPICS.forEach(t => { const p = tp(t.id); if(p.plays > 0) t.stages.slice(0, p.stage+1).forEach(s => out.push(s)); });
  return out;
}
function startRound(mode, topicId){
  const t = TOPIC[topicId];
  R = {mode, topicId, total: mode === "mix" ? 14 : 12, done:0, first:0, queue:[], log:{}, score:0, combo:0, best:0,
       warmLeft: mode === "topic" ? (t.unit === "U" ? 2 : (t.warm.length ? 1 : 0)) : 0, newStage:null, chainsDone:0, pending:null};
  R.stageAtStart = mode === "topic" ? tp(topicId).stage : 0;
  hideScreens(); $("hud").classList.remove("hidden");
  nextQuestion();
}
function okFn(){
  if(R.mode === "mix") { const av = availableSkillsForMix(); return id => av.includes(id); }
  const t = TOPIC[R.topicId], st = tp(t.id).stage;
  return id => !t.stages.includes(id) || t.stages.indexOf(id) <= st;
}
function refill(){
  const t = TOPIC[R.topicId];
  if(R.warmLeft > 0){
    R.warmLeft--;
    let pool = t.warm.filter(s => FOUNDATION_SKILLS.includes(s) || tp(Object.values(TOPIC).find(x => x.stages.includes(s)).id).plays > 0);
    // 30%: recycle the globally weakest foundation skill the player has met
    const met = FOUNDATION_SKILLS.filter(s => sk(s).n > 0);
    if(met.length && Math.random() < 0.3) pool = [met.reduce((a,b) => need(a) >= need(b) ? a : b)];
    if(!pool.length) return refill();
    const s = wpick(pool, need); R.queue.push({q:GEN[s](), tag:"warm"}); return;
  }
  const ok = okFn();
  if(R.mode === "mix"){
    const av = availableSkillsForMix();
    const chainIds = TOPICS.filter(x => tp(x.id).plays > 0).flatMap(x => x.chains);
    if(chainIds.length && Math.random() < 0.3){ return pushChain(pick(chainIds), ok); }
    const s = wpick(av, need); R.queue.push({q:GEN[s](), tag:"mix"}); return;
  }
  const st = tp(t.id).stage;
  if(t.chains.length && Math.random() < (t.unit === "U" ? 0.4 : 0.25) && (st >= 1 || t.unit === "U")) return pushChain(pick(t.chains), ok);
  const pool = t.stages.slice(0, st+1);
  const s = wpick(pool, id => need(id) * (id === t.stages[st] ? 2.2 : 1));
  R.queue.push({q:GEN[s](), tag:"main"});
}
function pushChain(id, ok){
  const c = CHAINS[id](ok);
  if(!c){ const t = TOPIC[R.topicId]; const pool = R.mode === "mix" ? availableSkillsForMix() : t.stages.slice(0, tp(t.id).stage+1);
          const s = wpick(pool, need); R.queue.push({q:GEN[s](), tag:R.mode === "mix" ? "mix" : "main"}); return; }
  c.steps.forEach((q,i) => R.queue.push({q, tag:"chain", chain:c.label, step:i+1, of:c.steps.length}));
}
function nextQuestion(){
  if(!R.queue.length){
    if(R.done >= R.total) return endRound();
    refill();
  }
  const it = R.queue.shift();
  R.cur = it;
  beginQuestion(it);
}

  const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
  g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t+d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02);
}
function noise(d, vol, freq){
  if(!AC || !S.settings.sound) return; const t = AC.currentTime;
  const b = AC.createBuffer(1, AC.sampleRate*d, AC.sampleRate), ch = b.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1) * (1 - i/ch.length);
  const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq || 2500; f.Q.value = 0.8;
  const g = AC.createGain(); g.gain.value = vol || 0.25; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}

};
function say(text){
  if(!S.settings.voice || !window.speechSynthesis || !text) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.85; u.lang = "en-US"; speechSynthesis.speak(u); }catch(e){}
}

/* =====================================================================
   GAME ENGINE (canvas)
   ===================================================================== */
const cv = $("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
const G = {q:null, items:[], bits:[], parts:[], splats:[], floats:[], trail:[], chop:null, phase:"idle", mistakes:0, shake:0, t:0, doneAt:0};
const FRUIT = [["#ff4d6d","#a3123a"],["#ff9f1c","#b35c00"],["#7ed957","#2f7d1a"],["#b264ff","#5b1fa3"],["#ffd23f","#b38600"],["#3fc5ff","#0b6c9e"],["#ff7ab6","#a8155e"]];
const PACE = {chill:7.2, normal:5.6, quick:4.2};
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  if(G.chop) layoutChop();
}
window.addEventListener("resize", resize); resize();
function hudBottom(){ const h = $("hud"); return h.classList.contains("hidden") ? 0 : h.getBoundingClientRect().bottom; }

/* ---- items ---- */
function measureItem(it){
  const short = it.label.length <= 2;
  if(short){ const r = clamp(Math.min(W,H)/10.5, 28, 44); it.r = r; it.hw = r; it.hh = r; it.font = `${Math.round(r*1.15)}px Bangers`; }
  else { const fs = clamp(Math.min(W,H)/17, 20, 30); ctx.font = `800 ${fs}px "Baloo 2"`; const tw = ctx.measureText(it.label).width;
         it.hh = fs*0.95; it.hw = Math.max(tw/2 + fs*0.8, it.hh*1.4); it.font = `800 ${fs}px "Baloo 2"`; }
}
function launchWave(list){
  const top = hudBottom() + 8;
  list.forEach(measureItem);
  const maxW = Math.max(...list.map(i => i.hw*2)) + 14, maxH = Math.max(...list.map(i => i.hh*2));
  const margin = 10; let rows = 1;
  while(rows < 3 && Math.ceil(list.length/rows)*maxW > W - margin*2) rows++;
  const perRow = Math.ceil(list.length/rows);
  const zoneTop = top + maxH*0.6, zoneBot = Math.max(zoneTop + rows*(maxH+16), H*0.62);
  const order = shuffle(list);
  const T = PACE[S.settings.pace] || PACE.chill;
  order.forEach((it, k) => {
    const r = Math.floor(k/perRow), c = k % perRow, inRow = Math.min(perRow, order.length - r*perRow);
    const slotW = (W - margin*2)/inRow;
    const ax = margin + slotW*(c + 0.5) + (Math.random()-0.5)*Math.max(0, slotW - maxW)*0.6;
    const rowGap = maxH + 18;
    const baseY = zoneTop + (zoneBot - zoneTop - rows*rowGap)*0.3 + maxH/2;
    const ay = baseY + r*rowGap + (Math.random()-0.5)*10;
    const y0 = H + it.hh + 12, tUp = T/2, h = y0 - ay;
    it.g = 2*h/(tUp*tUp); it.vy = -it.g*tUp;
    const x0 = clamp(ax + (Math.random()-0.5)*W*0.25, it.hw, W - it.hw);
    it.x = x0; it.y = y0; it.vx = (ax - x0)/tUp;
    const spin = it.label.length <= 2 ? 0.6 : 0.12;
    it.rot = (Math.random()-0.5)*spin*0.5; it.vr = (Math.random()-0.5)*spin;
    it.delay = r*0.35 + c*0.12; it.state = "wait";
    if(!it.col) it.col = pick(FRUIT);
  });
}
function beginQuestion(entry){
  const q = entry.q; G.q = q; G.mistakes = 0; G.wrongs = []; G.phase = "play"; G.items = []; G.chop = null; G.hinted = false;
  renderHud(entry);
  if(q.speak) setTimeout(() => say(q.speak), 350);
  if(q.kind === "slice"){
    G.items = q.items.map(o => Object.assign({}, o, {sliced:false}));
    requestAnimationFrame(() => launchWave(G.items));     // after HUD layout settles
  } else {
    G.chop = {word:q.word, n:q.word.length, need:new Set(q.cuts), made:new Set(), open:{}, flash:null, bob:0, done:0};
    layoutChop(); requestAnimationFrame(layoutChop);
    if(!S.tips.chop){ S.tips.chop = 1; save(); toast("✂️ Swipe DOWN through a gap between letters to chop (or tap the gap).", "info", 4200); }
  }
}
function layoutChop(){
  const c = G.chop; if(!c) return;
  const top = hudBottom();
  c.cw = clamp((W - 40)/c.n, 26, 72); c.th = c.cw*1.3;
  c.y = top + (H - top)*0.42; c.gapPx = clamp(c.cw*0.45, 12, 26);
}
function chopLetterX(c, i){
  const opened = [...c.made].sort((a,b) => a-b);
  const total = c.n*c.cw + opened.reduce((s,g) => s + c.gapPx*(c.open[g] || 0), 0);
  let x = W/2 - total/2 + i*c.cw;
  opened.forEach(g => { if(g <= i) x += c.gapPx*(c.open[g] || 0); });
  return x;
}
function chopGapX(c, g){ return g in c.open && c.made.has(g) ? chopLetterX(c, g) - c.gapPx*(c.open[g]||0)/2 : chopLetterX(c, g); }

/* ---- slicing ---- */
function segDist(px,py, ax,ay,bx,by){
  const dx = bx-ax, dy = by-ay, L = dx*dx + dy*dy; let t = L ? ((px-ax)*dx + (py-ay)*dy)/L : 0; t = clamp(t,0,1);
  const x = ax + t*dx, y = ay + t*dy; return Math.hypot(px-x, py-y);
}
function segSegDist(a,b,c,d){ // distance between segments ab and cd (no intersection test needed for our use: sample)
  if(segmentsCross(a,b,c,d)) return 0;
  return Math.min(segDist(a.x,a.y,c.x,c.y,d.x,d.y), segDist(b.x,b.y,c.x,c.y,d.x,d.y), segDist(c.x,c.y,a.x,a.y,b.x,b.y), segDist(d.x,d.y,a.x,a.y,b.x,b.y));
}
function segmentsCross(p1,p2,p3,p4){
  const d = (p2.x-p1.x)*(p4.y-p3.y) - (p2.y-p1.y)*(p4.x-p3.x); if(!d) return false;
  const u = ((p3.x-p1.x)*(p4.y-p3.y) - (p3.y-p1.y)*(p4.x-p3.x))/d, v = ((p3.x-p1.x)*(p2.y-p1.y) - (p3.y-p1.y)*(p2.x-p1.x))/d;
  return u >= 0 && u <= 1 && v >= 0 && v <= 1;
}
function hitItem(it, a, b){
  const half = it.hw - it.hh; // capsule core half-length
  return segSegDist(a, b, {x:it.x-half, y:it.y}, {x:it.x+half, y:it.y}) <= it.hh + 4;
}
function trySlice(a, b){
  if(G.phase !== "play" || !G.q || G.q.kind !== "slice") return;
  for(const it of G.items){ if(it.state === "fly" && !it.sliced && hitItem(it, a, b)) sliceItem(it, a, b); }
}
function sliceItem(it, a, b){
  it.sliced = true; it.state = "sliced";
  const ang = Math.atan2(b.y - a.y, b.x - a.x) || 0;
  spawnBits(it, ang);
  if(it.target){
    R.combo++; const mult = 1 + Math.floor(R.combo/3); const pts = 10*mult; R.score += pts;
    SFX.slice(R.combo);
    floatText(it.x, it.y - it.hh - 6, it.note ? `${it.note}` : `+${pts}`, "#b6ff6b");
    if(R.combo >= 3 && R.combo % 3 === 0) floatText(W/2, H*0.72, `COMBO ×${mult}!`, "#ffd24a", 34);
    markTile(it, true);
    if(G.items.filter(x => x.target && !x.sliced).length === 0) completeQuestion();
  } else {
    G.mistakes++; R.combo = 0; G.shake = 0.35; SFX.wrong();
    it.wrongHit = true;
    floatText(it.x, it.y - it.hh - 6, "✗", "#ff5a6e", 36);
    toast(it.why || "Not that one!", "", 3600); G.wrongs.push(it.why || `Not ${it.label}.`);
    if(G.mistakes >= 1 && G.q.hint && !G.hinted){ G.hinted = true; setNote(`💡 ${G.q.hint}`, "hint"); }
  }
  updateScore();
}
function spawnBits(it, ang){
  const col = it.target || !G.q || G.q.kind !== "slice" ? it.col : ["#777","#444"];
  for(let s=-1; s<=1; s+=2){
    G.bits.push({it, side:s, x:it.x, y:it.y, vx:it.vx*0.4 + Math.cos(ang + Math.PI/2)*s*90, vy:Math.min(it.vy, 0)*0.2 - 60 + Math.sin(ang + Math.PI/2)*s*60,
                 rot:it.rot, vr:s*2.5, life:1.2, ang, gray:!it.target});
  }
  for(let i=0;i<16;i++){ const a = Math.random()*Math.PI*2, sp = 80 + Math.random()*260;
    G.parts.push({x:it.x, y:it.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 80, r:2 + Math.random()*4, life:0.7 + Math.random()*0.4, col:col[0]}); }
  G.splats.push({x:it.x, y:it.y, r:it.hh*1.4, col:col[0], life:2.2});
}
function floatText(x, y, text, col, size){ G.floats.push({x, y, text, col, size:size || 24, life:1.1}); }

/* ---- chopping ---- */
function tryChop(a, b, tapX){
  const c = G.chop; if(!c || G.phase !== "play") return;
  let x;
  if(tapX != null) x = tapX;
  else {
    const y = c.y; if((a.y - y)*(b.y - y) > 0) return;          // stroke must cross the word's middle line
    const t = (y - a.y)/((b.y - a.y) || 1e-6); x = a.x + t*(b.x - a.x);
  }
  let best = -1, bd = 1e9;
  for(let g=1; g<c.n; g++){ const d = Math.abs(chopGapX(c, g) - x); if(d < bd){ bd = d; best = g; } }
  if(best < 0 || bd > c.cw*0.42 || c.made.has(best)) return;
  if(P.cutSet && P.cutSet.has(best)) return; if(P.cutSet) P.cutSet.add(best);
  if(c.need.has(best)){
    c.made.add(best); c.open[best] = 0; SFX.chop(); R.combo++; const pts = 15*(1 + Math.floor(R.combo/3)); R.score += pts;
    floatText(chopGapX(c,best), c.y - c.th*0.9, `+${pts}`, "#b6ff6b");
    for(let i=0;i<12;i++){ const ang = Math.random()*Math.PI*2, sp = 60 + Math.random()*200;
      G.parts.push({x:chopGapX(c,best), y:c.y + (Math.random()-0.5)*c.th, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 60, r:2 + Math.random()*3, life:0.6, col:"#e2b36b"}); }
    if([...c.need].every(g => c.made.has(g))) completeQuestion();
  } else {
    G.mistakes++; R.combo = 0; c.flash = {g:best, t:0.7}; G.shake = 0.3; SFX.wrong();
    toast(G.q.cutWhy || "Not there!", "", 3600); G.wrongs.push(G.q.cutWhy || "Not there.");
    if(G.q.kind === "chop" && G.q.skill === "vccv_split" && !G.q.showCode){ G.q.showCode = true; }
    if(G.q.hint && !G.hinted){ G.hinted = true; setNote(`💡 ${G.q.hint}`, "hint"); }
  }
  updateScore();
}

/* ---- completion ---- */
function completeQuestion(){
  G.phase = "done"; G.doneAt = performance.now();
  const q = G.q, first = G.mistakes === 0;
  recordSkill(q.skill, first);
  R.done++; if(first) R.first++;
  (R.log[q.skill] = R.log[q.skill] || {n:0, ok:0}).n++; if(first) R.log[q.skill].ok++;
  if(first){ R.score += 25; }
  R.marks = R.marks || []; R.marks.push(first);
  if(R.cur.tag === "chain" && R.cur.step === R.cur.of){ R.score += 50; R.chainsDone++; floatText(W/2, H*0.66, "🔗 CHAIN COMPLETE +50", "#9ef0ff", 28); }
  SFX.done(); updateScore();
  G.items.forEach(it => { if(!it.sliced) it.leaving = true; });
  if(q.revealCode) revealCode();
  if(q.revealTags) $("ctx").querySelector(".sent")?.classList.add("tags");
  if(G.chop) G.chop.done = 0.001;
  setNote(`✓ ${q.why}`, "good");
  maybeAdvanceStage();
  save(); renderProg();
  if(first){ G.autoNext = setTimeout(goNext, R.cur.tag === "chain" ? 2300 : 1900); }
  else { G.autoNext = setTimeout(() => showExplain(q), 900); }
}
function goNext(){
  clearTimeout(G.autoNext); G.autoNext = null; if(G.phase !== "done") return;
  G.phase = "between"; hideToast();
  if(R.newStage){ const s = R.newStage; R.newStage = null; toast(`🆕 NEW SKILL: ${SKILLS[s].name}! ${SKILLS[s].tip}`, "new", 4200); SFX.level(); }
  nextQuestion();
}
function maybeAdvanceStage(){
  if(R.mode !== "topic") return;
  const t = TOPIC[R.topicId], p = tp(t.id);
  if(p.stage >= t.stages.length - 1) return;
  const cur = sk(t.stages[p.stage]);
  if(cur.m >= 0.55 && cur.n >= 3){ p.stage++; p.stageRounds = 0; R.newStage = t.stages[p.stage]; }
}

/* ---- input ---- */
const P = {down:false, x:0, y:0, sx:0, sy:0, moved:0, cutSet:null, id:null};
cv.addEventListener("pointerdown", e => {
  audioInit(); if(AC && AC.state === "suspended") AC.resume();
  if(G.phase === "done" && performance.now() - G.doneAt > 500 && G.mistakes === 0){ goNext(); return; }
  P.down = true; P.id = e.pointerId; P.x = P.sx = e.clientX; P.y = P.sy = e.clientY; P.moved = 0; P.cutSet = new Set(); P.swished = false;
  G.trail = [{x:P.x, y:P.y, t:performance.now()}];
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
cv.addEventListener("pointermove", e => {
  if(!P.down || e.pointerId !== P.id) return;
  const pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for(const pe of (pts.length ? pts : [e])){
    const a = {x:P.x, y:P.y}, b = {x:pe.clientX, y:pe.clientY};
    const d = Math.hypot(b.x - a.x, b.y - a.y); if(d < 1) continue;
    P.moved += d; P.x = b.x; P.y = b.y;
    G.trail.push({x:b.x, y:b.y, t:performance.now()});
    if(P.moved > 40 && !P.swished){ P.swished = true; SFX.swish(); }
    if(P.moved > 10){ trySlice(a, b); tryChop(a, b); }
  }
});
function endPointer(e){
  if(!P.down || e.pointerId !== P.id) return; P.down = false;
  if(P.moved < 10){
    const p = {x:e.clientX, y:e.clientY};
    if(G.q && G.q.kind === "slice") trySlice({x:p.x-1, y:p.y}, {x:p.x+1, y:p.y});
    else if(G.chop && Math.abs(p.y - G.chop.y) < G.chop.th*0.8) tryChop(null, null, p.x);
  }
}
cv.addEventListener("pointerup", endPointer); cv.addEventListener("pointercancel", endPointer);

/* ---- loop ---- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; G.t += dt;
  requestAnimationFrame(loop);
  try{ update(dt); draw(now); }catch(e){ console.error(e); }
}
function update(dt){
  // items
  let flying = 0;
  for(const it of G.items){
    if(it.state === "wait"){ it.delay -= dt; if(it.delay <= 0) it.state = "fly"; else { flying++; continue; } }
    if(it.state === "fly"){
      flying++;
      it.vy += it.g*dt; it.x += it.vx*dt; it.y += it.vy*dt; it.rot += it.vr*dt;
      if(it.leaving){ it.alpha = (it.alpha == null ? 1 : it.alpha) - dt*2.5; if(it.alpha <= 0) it.state = "gone"; }
      if(it.vy > 0 && it.y - it.hh > H + 10){
        it.state = "gone";
        if(it.target && !it.sliced && G.phase === "play"){ R.combo = 0; floatText(clamp(it.x, 60, W-60), H - 40, "missed — it'll come back!", "#ffb86b", 18); }
      }
    }
  }
  if(G.phase === "play" && G.q && G.q.kind === "slice" && flying === 0){
    const again = G.items.filter(it => !it.sliced);
    if(again.length) launchWave(again);
  }
  for(const b of G.bits){ b.vy += 900*dt; b.x += b.vx*dt; b.y += b.vy*dt; b.rot += b.vr*dt; b.life -= dt; }
  G.bits = G.bits.filter(b => b.life > 0 && b.y < H + 200);
  for(const p of G.parts){ p.vy += 700*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for(const s of G.splats) s.life -= dt; G.splats = G.splats.filter(s => s.life > 0);
  for(const f of G.floats){ f.y -= 40*dt; f.life -= dt; } G.floats = G.floats.filter(f => f.life > 0);
  const nowT = performance.now(); G.trail = G.trail.filter(p => nowT - p.t < 180);
  if(G.shake > 0) G.shake -= dt;
  const c = G.chop;
  if(c){ c.bob += dt; for(const g in c.open) c.open[g] = Math.min(1, c.open[g] + dt*5);
         if(c.flash){ c.flash.t -= dt; if(c.flash.t <= 0) c.flash = null; }
         if(c.done) c.done = Math.min(1, c.done + dt*2); }
}

/* ---- drawing ---- */
let bgCache = null;
function drawBg(){
  if(!bgCache || bgCache.w !== W || bgCache.h !== H){
    const o = document.createElement("canvas"); o.width = W*DPR; o.height = H*DPR; const g = o.getContext("2d"); g.scale(DPR, DPR);
    const gr = g.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#1c0f38"); gr.addColorStop(1,"#2b1640"); g.fillStyle = gr; g.fillRect(0,0,W,H);
    // wooden dojo planks
    g.globalAlpha = 0.18; const pw = 90;
    for(let x=0; x<W; x+=pw){ g.fillStyle = (x/pw)%2 ? "#5a3a2a" : "#4a2e22"; g.fillRect(x,0,pw-3,H);
      g.strokeStyle = "#2a160e"; g.lineWidth = 1; for(let k=0;k<5;k++){ g.beginPath(); const yy = (k*173 + x*7)%H; g.moveTo(x+8, yy); g.quadraticCurveTo(x+pw/2, yy+18, x+pw-12, yy+4); g.stroke(); } }
    g.globalAlpha = 1;
    const v = g.createRadialGradient(W/2,H*0.55,Math.min(W,H)*0.2, W/2,H*0.55,Math.max(W,H)*0.8); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.55)");
    g.fillStyle = v; g.fillRect(0,0,W,H);
    bgCache = {c:o, w:W, h:H};
  }
  ctx.drawImage(bgCache.c, 0, 0, W, H);
}
function pathCapsule(g, hw, hh){
  const r = hh, core = hw - hh; g.beginPath();
  g.moveTo(-core, -r); g.lineTo(core, -r); g.arc(core, 0, r, -Math.PI/2, Math.PI/2); g.lineTo(-core, r); g.arc(-core, 0, r, Math.PI/2, Math.PI*1.5); g.closePath();
}
function drawFruit(it, gray, alpha){
  const col = gray ? ["#8a8a8a","#3c3c3c"] : it.col;
  ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
  const gr = ctx.createRadialGradient(-it.hw*0.3, -it.hh*0.5, 2, 0, 0, Math.max(it.hw, it.hh)*1.2);
  gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.18, col[0]); gr.addColorStop(1, col[1]);
  pathCapsule(ctx, it.hw, it.hh); ctx.fillStyle = gr; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.stroke();
  if(it.label.length <= 2){ ctx.fillStyle = "#3b7d1f"; ctx.beginPath(); ctx.ellipse(it.hw*0.25, -it.hh*1.02, it.hw*0.28, it.hh*0.12, -0.5, 0, Math.PI*2); ctx.fill(); }
  ctx.font = it.font; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineJoin = "round";
  const ty = it.label.length <= 2 ? 3 : 2;
  ctx.strokeText(it.label, 0, ty); ctx.fillStyle = "#fff"; ctx.fillText(it.label, 0, ty);
  ctx.restore();
}
function drawChop(now){
  const c = G.chop; if(!c.cw) return; const bob = Math.sin(c.bob*2)*4*(1 - (c.done || 0));
  const y = c.y + bob, th = c.th, cw = c.cw;
  const cuts = [...c.made].sort((a,b) => a-b), bounds = [0, ...cuts, c.n];
  const spread = (c.done || 0)*16;
  for(let k=0; k<bounds.length-1; k++){
    const i0 = bounds[k], i1 = bounds[k+1];
    const off = (k - (bounds.length-2)/2)*spread;
    const x0 = chopLetterX(c, i0) + off, x1 = chopLetterX(c, i1-1) + cw + off;
    ctx.save();
    const gr = ctx.createLinearGradient(0, y - th/2, 0, y + th/2); gr.addColorStop(0, "#d79a5b"); gr.addColorStop(0.5, "#b8763a"); gr.addColorStop(1, "#7a4a1f");
    ctx.fillStyle = gr; roundRect(x0+2, y - th/2, x1 - x0 - 4, th, 12); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#4a2a10"; ctx.stroke();
    ctx.strokeStyle = "rgba(74,42,16,.35)"; ctx.lineWidth = 2;
    for(let gl=0; gl<3; gl++){ ctx.beginPath(); const gy = y - th/2 + th*(0.25 + gl*0.25); ctx.moveTo(x0+10, gy); ctx.bezierCurveTo(x0+(x1-x0)*0.3, gy-4, x0+(x1-x0)*0.7, gy+4, x1-10, gy); ctx.stroke(); }
    for(let i=i0; i<i1; i++){
      const lx = chopLetterX(c, i) + off + cw/2;
      let fill = "#fff";
      const q = G.q;
      if(q.team && i >= q.team.i && i < q.team.i+2 && c.done) fill = "#ff9ff3";
      ctx.font = `${Math.round(cw*0.92)}px Bangers`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 6; ctx.strokeStyle = "#2a1505"; ctx.strokeText(U(c.word[i]), lx, y + 3); ctx.fillStyle = fill; ctx.fillText(U(c.word[i]), lx, y + 3);
      if(q.showCode){ const v = isV(c.word[i]); ctx.font = `${Math.round(cw*0.5)}px Bangers`; ctx.fillStyle = v ? "#ff9f1c" : "#38b6ff";
        ctx.fillText(v ? "V" : "C", lx, y + th/2 + cw*0.38); }
    }
    ctx.restore();
  }
  // gap guides (subtle) so the player sees where cuts go
  if(G.phase === "play"){
    for(let g=1; g<c.n; g++){ if(c.made.has(g)) continue; const gx = chopGapX(c, g);
      ctx.strokeStyle = "rgba(255,255,255,.16)"; ctx.setLineDash([4,6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(gx, y - th*0.75); ctx.lineTo(gx, y + th*0.75); ctx.stroke(); ctx.setLineDash([]); }
  }
  if(c.flash){ const gx = chopGapX(c, c.flash.g); ctx.strokeStyle = `rgba(255,90,110,${c.flash.t/0.7})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(gx, y - th*0.9); ctx.lineTo(gx, y + th*0.9); ctx.stroke(); }
}
function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function draw(now){
  ctx.save();
  if(G.shake > 0){ const s = G.shake*18; ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s); }
  drawBg();
  for(const s of G.splats){ ctx.globalAlpha = Math.min(0.35, s.life*0.25); ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    for(let k=0;k<5;k++){ const a = k*1.3 + s.x, rr = s.r*0.35; ctx.beginPath(); ctx.arc(s.x + Math.cos(a)*s.r*1.1, s.y + Math.sin(a)*s.r*1.1, rr, 0, Math.PI*2); ctx.fill(); } }
  ctx.globalAlpha = 1;
  if(G.chop) drawChop(now);
  for(const it of G.items){ if(it.state !== "fly") continue; ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot); drawFruit(it, false, it.alpha); ctx.restore(); }
  for(const b of G.bits){
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    ctx.beginPath(); const big = Math.max(b.it.hw, b.it.hh)*2.2; ctx.rotate(b.ang + Math.PI/2);
    ctx.rect(b.side < 0 ? -big : 0, -big, big, big*2); ctx.clip(); ctx.rotate(-(b.ang + Math.PI/2));
    drawFruit(b.it, b.gray, Math.min(1, b.life*1.5)); ctx.restore();
  }
  for(const p of G.parts){ ctx.globalAlpha = Math.max(0, p.life*1.4); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
  // blade trail
  if(G.trail.length > 1){
    const tnow = performance.now();
    for(let i=1; i<G.trail.length; i++){ const a = G.trail[i-1], b = G.trail[i], age = (tnow - b.t)/180;
      ctx.strokeStyle = `rgba(255,255,255,${0.9*(1-age)})`; ctx.lineWidth = 2 + 9*(i/G.trail.length)*(1-age); ctx.lineCap = "round";
      ctx.shadowColor = "#9ef0ff"; ctx.shadowBlur = 14; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    ctx.shadowBlur = 0;
  }
  for(const f of G.floats){ ctx.globalAlpha = Math.min(1, f.life*1.6); ctx.font = `${f.size}px Bangers`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 5; ctx.strokeStyle = "#000"; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y); }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* =====================================================================
   SELF-TEST (run window.__selfTest() in the console)
   ===================================================================== */
window.__selfTest = function(n){
  n = n || 150; const errs = [];
  const chk = (q, where) => {
    if(!q || !SKILLS[q.skill]) return errs.push(`${where}: bad skill`);
    if(q.kind === "slice"){
      const t = q.items.filter(i => i.target);
      if(!t.length) errs.push(`${where}: no target`);
      if(q.items.length < 2 || q.items.length > 9) errs.push(`${where}: ${q.items.length} items`);
      if(!q.ctx || q.ctx.t !== "word" && q.ctx.t !== "sent"){ const labs = q.items.map(i => i.label); if(uniq(labs).length !== labs.length) errs.push(`${where}: dup labels ${labs}`); }
      if(q.items.some(i => !i.target && !i.why)) errs.push(`${where}: missing why for ${q.items.filter(i => !i.target && !i.why).map(i => i.label)}`);
    } else {
      if(!q.cuts.length || q.cuts.some(c => c < 1 || c >= q.word.length)) errs.push(`${where}: bad cuts ${q.word} ${q.cuts}`);
    }
    if(!q.why) errs.push(`${where}: no why`);
  };
  for(const id in GEN) for(let i=0;i<n;i++){ try{ chk(GEN[id](), id); }catch(e){ errs.push(`${id}: ${e.message}`); } }
  const ok = () => true;
  for(const id in CHAINS) for(let i=0;i<n;i++){ try{ CHAINS[id](ok).steps.forEach((q,k) => chk(q, `chain ${id}#${k}`)); }catch(e){ errs.push(`chain ${id}: ${e.message}`); } }
  VCCV.forEach(e => { const c = codeOf(e.w); if(c.slice(e.cut-2, e.cut+2) !== "VCCV") errs.push(`VCCV ${e.w} ${c}`); });
  VCV_WORDS.forEach(w => { if(codeOf(w).includes("VCCV")) errs.push(`VCV list has VCCV: ${w}`); });
  INFL.forEach(e => { if(inflWrong(e).length < 2) errs.push(`infl distractors ${e.res}`); });
  BASE_CHANGED.forEach(e => { if(!e.w.startsWith(e.base.slice(0, e.base.length-1))) errs.push(`base ${e.w}`); });
  SPELL4.forEach(s => { if(!teamOf(s.w,4)) errs.push(`no team ${s.w}`); });
  SPELL5.forEach(s => { if(!teamOf(s.w,5)) errs.push(`no diph ${s.w}`); });
  Object.keys(BASE_SENT).forEach(w => { if(!BASE_CHOP.find(x => x.w === w)) errs.push(`BASE_SENT ${w} not in BASE_CHOP`); });
  return uniq(errs);
};

$("build").textContent = "build " + BUILD;
renderMap();
</script>
